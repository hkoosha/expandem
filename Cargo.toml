[package]
name = "expandem"
version = "0.1.0"
authors = ["Koosha H <git@koosha.io>"]
license = "AGPL-3.0-only"
description = "Selective macro expansion powered by rust-analyzer"
edition = "2024"
homepage = "https://koosha.io/project/expandem"
repository = "https://gitlab.com/hkoosha/expandem"
categories = ["compilers", "development-tools::procedural-macro-helpers"]

[lints.clippy]
needless_return = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
codegen-units = 256
incremental = true
lto = "off"

[dependencies]
log = "0.4"
env_logger = "0.11"

ra_ap_hir = "0.0.352"
ra_ap_ide = "0.0.352"
ra_ap_ide_db = "0.0.352"
ra_ap_load-cargo = "0.0.352"
ra_ap_project_model = "0.0.352"
ra_ap_syntax = "0.0.352"
ra_ap_vfs = "0.0.352"
